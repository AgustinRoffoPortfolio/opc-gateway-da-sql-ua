<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway OPC DA + SQL → UA — Diagnóstico</title>
<style>
  :root { --ok:#2e9e5b; --warn:#c98a12; --bad:#c0392b; --idle:#7a7a7a; --line:#dcdcdc; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; font:15px/1.5 "Segoe UI",system-ui,sans-serif;
         color:#1e1e1e; background:#f6f6f6; }
  header { display:flex; align-items:baseline; gap:16px; margin-bottom:20px; }
  h1 { font-size:19px; margin:0; font-weight:600; }
  .stamp { color:#666; font-size:13px; font-variant-numeric:tabular-nums; }
  nav { display:flex; gap:8px; margin-bottom:20px; }
  nav button { padding:7px 16px; border:1px solid var(--line); background:#fff;
               border-radius:4px; cursor:pointer; font-size:14px; }
  nav button.active { background:#1e1e1e; color:#fff; border-color:#1e1e1e; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px;
          padding:20px; margin-bottom:16px; }
  .light { display:flex; align-items:center; gap:14px; }
  .dot { width:22px; height:22px; border-radius:50%; background:var(--idle); flex:none; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); }
  .dot.bad { background:var(--bad); } .dot.idle { background:var(--idle); }
  .state { font-size:22px; font-weight:600; }
  .verdict { margin:14px 0 0; }
  .verdict .num { font-variant-numeric:tabular-nums; font-weight:600; }
  .hint { margin:8px 0 0; color:#555; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .metric .k { font-size:12px; color:#666; text-transform:uppercase; letter-spacing:.04em; }
  .metric .v { font-size:19px; font-variant-numeric:tabular-nums; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em;
       color:#666; margin:0 0 14px; font-weight:600; }
  .hidden { display:none; }
  .controls { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .controls input[type=search] { flex:1; max-width:340px; padding:7px 10px;
       border:1px solid var(--line); border-radius:4px; font-size:14px; }
  .controls label { font-size:14px; color:#444; display:flex; align-items:center; gap:6px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
       color:#666; font-weight:600; padding:0 10px 8px 0; border-bottom:1px solid var(--line); }
  td { padding:7px 10px 7px 0; border-bottom:1px solid #f0f0f0;
       font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.name { font-family:Consolas,monospace; white-space:normal; }
  .q-Good { color:var(--ok); } .q-Uncertain { color:var(--warn); } .q-Bad { color:var(--bad); }
  .sub { color:#777; font-size:12px; }
  .foot { margin-top:12px; color:#666; font-size:13px; }
</style>
</head>
<body>

<header>
  <h1>Gateway OPC DA + SQL → UA</h1>
  <span class="stamp" id="stamp">—</span>
</header>

<nav>
  <button id="tab-op" class="active">Operador</button>
  <button id="tab-det">Detalle</button>
</nav>

<section id="view-op">
  <!-- Una tarjeta por fuente, generada en runtime: cuantas hay lo dice el
       snapshot, no el HTML. Es lo que hace visible que una fuente este caida
       mientras la otra sigue sana. -->
  <div id="sources">
    <div class="card">
      <div class="light">
        <span class="dot idle"></span>
        <span class="state">Conectando…</span>
      </div>
      <p class="verdict">Esperando el primer ciclo del gateway.</p>
    </div>
  </div>

  <div class="card">
    <h2>Tags (todas las fuentes)</h2>
    <div class="grid" id="tagCounters"></div>
  </div>

  <div class="card">
    <h2>Proceso</h2>
    <div class="grid" id="perfCounters"></div>
  </div>
  <div class="card">
    <h2>Conexiones UA</h2>
    <div class="grid" id="auditCounters"></div>
    <p class="foot" id="auditDetail">—</p>
  </div>
</section>

<section id="view-det" class="hidden">
  <div class="card">
    <div class="controls">
      <input type="search" id="search" placeholder="Buscar tag…">
      <label><input type="checkbox" id="onlyDegraded" checked> Solo degradados</label>
    </div>
    <table>
      <thead><tr>
        <th>Tag UA</th><th>Fuente</th><th>Tag de origen</th><th>Valor</th><th>Calidad</th>
        <th>SourceTimestamp</th><th>Última lectura (gateway)</th><th>Antigüedad</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="foot" id="foot">—</p>
  </div>
</section>

<script>
// Un contador con su frase concordada: "1 dejaron de responder" es lo primero
// que se ve en una fuente con un solo tag mudo.
const cnt = (k, uno, varios) => `<span class="num">${k}</span> ${k === 1 ? uno : varios}`;

// Cada diagnostico se traduce a una frase con los contadores que lo generaron
// al lado: un nombre de enum solo no le dice nada a quien mira la pantalla, y
// un numero sin su interpretacion tampoco. La segunda linea, cuando existe, es
// que hacer al respecto. Se evalua por fuente: un CSV mal escrito del lado SQL
// no dice nada sobre el lado DA.
function verdict(s) {
  const c = s.counters, l = s.link;
  const n = c.silentNeverAnswered, p = c.silentPreviouslyAnswered, t = c.totalConfigured;
  const src = SOURCE_ES[l.source] ?? l.source;
  const deT = `de ${cnt(t, "tag", "tags")}`;
  switch (s.diagnosis) {
    case "Healthy":
      return [t === 1
        ? "El único tag de esta fuente responde con calidad buena."
        : `Los <span class="num">${c.good}</span> de <span class="num">${t}</span> tags de esta fuente responden con calidad buena.`, ""];
    case "LinkDown":
      return [`Sin vínculo con ${src}. Reintentos: <span class="num">${l.reconnectAttempts}</span>.`,
              l.lastError ? `Último error: ${l.lastError}` : `Verificá que ${src} esté corriendo.`];
    case "ServerStalled":
      return [`El vínculo está abierto pero el ciclo no vuelve hace <span class="num">${(s.secondsSinceLastCycle ?? 0).toFixed(0)}</span> s.`,
              `${src} no murió: dejó de contestar. Suele requerir reiniciarlo.`];
    case "LikelyCsvMismatch":
      return [`${cnt(n, `${deT} nunca entregó`, `${deT} nunca entregaron`)} un dato desde que arrancó el gateway.`,
              "Esos nombres no existen del otro lado: revisá el CSV de mapeo o que la fuente tenga su configuración cargada. Desde adentro del gateway las dos causas son indistinguibles."];
    case "ServerRepopulatedEmpty":
      return [`${cnt(p, "tag que antes respondía dejó de hacerlo", "tags que antes respondían dejaron de hacerlo")}.`,
              `${src} sigue en pie pero perdió sus items: el caso del simulador relanzado sin su configuración.`];
    case "PartialDegradation":
      return [`${cnt(c.silentTotal, `${deT} está mudo`, `${deT} están mudos`)}; el resto responde bien.`,
              "Son una minoría: no hay una causa global. Mirá cuáles en la vista Detalle."];
    case "Indeterminate":
      return [`${cnt(n, "tag nunca respondió", "tags nunca respondieron")} y ${cnt(p, "dejó de responder", "dejaron de responder")}.`,
              "Están pasando dos cosas a la vez; el gateway no elige una por vos."];
    default:
      return [s.diagnosis, ""];
  }
}

// El color lo manda el vinculo, pero un diagnostico no-sano lo baja a ambar:
// vinculo sano con la mitad de los tags mudos no es verde para quien opera.
function color(link, diag) {
  if (link === "Disconnected") return "bad";
  if (link === "Stalled" || link === "Reconnecting") return "warn";
  return diag === "Healthy" ? "ok" : "warn";
}

const LINK_ES = { Connected:"Conectado", Disconnected:"Desconectado",
                  Reconnecting:"Reconectando", Stalled:"Sin respuesta" };

// Los valores son los del enum TagSource de Gateway.Core, serializado como texto.
const SOURCE_ES = { OpcDa:"el servidor DA", Sql:"la base SQL" };
const SOURCE_TITLE = { OpcDa:"OPC DA", Sql:"SQL Server" };

const metrics = pairs => pairs.map(([k, v]) =>
  `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

function cells(el, pairs) { el.innerHTML = metrics(pairs); }

// Una fuente = una tarjeta con su semaforo, su veredicto y sus tiempos de
// ciclo. Los tiempos viven aca y no en un panel unico porque 1000 ms de DA y
// decenas de segundos de SQL no promedian a nada util.
function sourceCard(s) {
  const [main, hint] = verdict(s);
  const l = s.link;
  return `<div class="card">
    <h2>${esc(SOURCE_TITLE[l.source] ?? l.source)}</h2>
    <div class="light">
      <span class="dot ${color(l.state, s.diagnosis)}"></span>
      <span class="state">${esc(LINK_ES[l.state] ?? l.state)}</span>
    </div>
    <p class="verdict">${main}</p>
    <p class="hint">${esc(hint)}</p>
    <div class="grid" style="margin-top:16px">${metrics([
      ["Ciclo hace", (s.secondsSinceLastCycle ?? 0).toFixed(1) + " s"],
      ["Ciclos", l.readCycles], ["Fallos de lectura", l.readFailures],
      ["Último ciclo", l.lastCycleMs.toFixed(1) + " ms"],
      ["Promedio", l.avgCycleMs.toFixed(1) + " ms"],
      ["Máximo", l.maxCycleMs.toFixed(1) + " ms"],
      ["Intervalo", l.configuredIntervalMs + " ms"],
      // Disconnections y no Connections: Connections cuenta tambien la
      // primera conexion, asi que arrancaba en 1 con el vinculo recien
      // levantado y se leia como una caida que no hubo.
      ["Caídas", l.disconnections]
    ])}</div>
  </div>`;
}

// Una fuente con tags declarados que no arranco (B3). Sin vinculo ni
// contadores: solo el aviso, para que no desaparezca de la pantalla. Una
// fuente sin tags declarados no llega aca: no se usa y no se muestra.
function inactiveCard(i) {
  return `<div class="card">
    <h2>${esc(SOURCE_TITLE[i.source] ?? i.source)}</h2>
    <div class="light">
      <span class="dot bad"></span>
      <span class="state">Inactiva</span>
    </div>
    <p class="verdict">${esc(i.reason)}</p>
  </div>`;
}

function paint(s) {
  document.getElementById("sources").innerHTML =
    s.sources.map(sourceCard).join("") + (s.inactiveSources ?? []).map(inactiveCard).join("");
  document.getElementById("stamp").textContent =
    `foto ${new Date(s.takenUtc).toLocaleTimeString("es-AR", { hour12: false })} · en pie ${Math.floor(s.status.uptimeSeconds / 60)} min`;

  const c = s.counters;
  cells(document.getElementById("tagCounters"), [
    ["Configurados", c.totalConfigured], ["Good", c.good],
    ["Uncertain", c.uncertain], ["Bad", c.bad],
    ["Nunca respondieron", c.silentNeverAnswered],
    ["Dejaron de responder", c.silentPreviouslyAnswered]
  ]);

  const p = s.performance;
  // workingSetMb llega con la cola binaria del calculo: se recorta al mostrar,
  // no en el dato, para que el JSON siga siendo el numero sin redondear.
  cells(document.getElementById("perfCounters"), [
    ["Sesiones UA", p.connectedUaSessions],
    ["Monitored items", p.monitoredItems],
    ["Memoria", p.workingSetMb.toFixed(1) + " MB"]
  ]);

  // El desglose por motivo vive solo aca y no en el address space UA: es un
  // diccionario de largo variable, y crear nodos en runtime romperia el
  // contrato de que el arbol UA es estable.
  const a = s.audit;
  cells(document.getElementById("auditCounters"), [
    ["Sesiones abiertas", a.sessionsCreated],
    ["Sesiones cerradas", a.sessionsClosed],
    ["Rechazos por certificado", a.rejectedByCertificate],
    ["Rechazos por token", a.rejectedByToken],
    ["Rechazos totales", a.rejectedTotal]
  ]);

  // Los motivos son nombres simbolicos de StatusCode que vienen del stack UA,
  // no del CSV, pero se escapan igual: el criterio es que nada que no haya
  // escrito esta pagina entra al DOM sin pasar por esc().
  const reasons = Object.entries(a.rejectionsByReason ?? {});
  document.getElementById("auditDetail").innerHTML = reasons.length === 0
    ? "Sin intentos rechazados desde que arrancó el gateway."
    : reasons.sort((x, y) => y[1] - x[1])
        .map(([r, n]) => `${esc(r)}: <span class="num">${n}</span>`).join(" · ")
      + (a.lastRejectionUtc ? ` — último ${hhmmss(a.lastRejectionUtc)}` : "");
}

// Tres estados distintos y no dos: "todavia no hay dato" (503) no es lo mismo
// que "no llego la respuesta" (el gateway se cayo o la pagina quedo abierta).
function waiting(text, bad) {
  document.getElementById("sources").innerHTML =
    `<div class="card"><div class="light">
       <span class="dot ${bad ? "bad" : "idle"}"></span><span class="state">—</span>
     </div><p class="verdict">${esc(text)}</p></div>`;
}

async function poll() {
  try {
    const res = await fetch("/api/diagnostics");
    if (res.status === 503) { waiting("El gateway todavía no publicó su primer ciclo."); return; }
    if (!res.ok) { waiting("El gateway respondió con un error: " + res.status); return; }
    paint(await res.json());
  } catch {
    waiting("Sin respuesta del gateway. ¿Sigue corriendo el proceso?", true);
  }
}

// Los nombres salen del CSV, que es configuracion de terceros: se escapan antes
// de meterlos en el DOM. Un ItemID con un < no deberia poder inyectar markup.
const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const hhmmss = iso => new Date(iso).toLocaleTimeString("es-AR", { hour12: false });

let detailVisible = false;

// Los dos timestamps van lado a lado a proposito: es donde se ve que el gateway
// no pisa la hora de origen. Si el de la izquierda queda atras del de la derecha,
// el dato es viejo aunque la lectura sea reciente.
async function pollTags() {
  if (!detailVisible) return;   // con 8.000 tags, pagar esta consulta por segundo
                                // para una tabla que nadie mira no tiene sentido.
  const q = new URLSearchParams({
    onlyDegraded: document.getElementById("onlyDegraded").checked,
    search: document.getElementById("search").value,
    limit: 100
  });
  try {
    const res = await fetch("/api/diagnostics/tags?" + q);
    if (!res.ok) { document.getElementById("foot").textContent = "Error " + res.status; return; }
    const page = await res.json();

    document.getElementById("rows").innerHTML = page.rows.map(r => `
      <tr>
        <td class="name">${esc(r.uaName)}</td>
        <td>${esc(r.source)}</td>
        <td class="name">${esc(r.sourceTag ?? "—")}</td>
        <td>${r.scaledValue === null ? "—" : esc(r.scaledValue)}</td>
        <td class="q-${esc(r.qualityMaster)}">${esc(r.qualityMaster)}${
            r.qualitySubstatus === r.qualityMaster ? ""
              : ` <span class="sub">${esc(r.qualitySubstatus)}</span>`}</td>
        <td>${r.sourceTimestamp === null
              ? '<span class="sub">nunca respondió</span>'
              : hhmmss(r.sourceTimestamp)}</td>
        <td>${hhmmss(r.lastUpdateUtc)}</td>
        <td>${r.secondsSinceUpdate.toFixed(1)} s</td>
      </tr>`).join("");

    // Sin paginado: con 100 filas ya se ve el patron, y para encontrar un tag
    // puntual el buscador es mas directo que recorrer paginas.
    const shown = page.rows.length, total = page.totalMatching;
    document.getElementById("foot").textContent = total === 0
      ? "Ningún tag coincide con el filtro."
      : shown < total
        ? `Mostrando ${shown} de ${total} — refiná la búsqueda para ver el resto.`
        : `${total} tag${total === 1 ? "" : "s"}.`;
  } catch {
    document.getElementById("foot").textContent = "Sin respuesta del gateway.";
  }
}

document.getElementById("tab-op").onclick = () => showTab(true);
document.getElementById("tab-det").onclick = () => showTab(false);
function showTab(op) {
  detailVisible = !op;
  document.getElementById("tab-op").classList.toggle("active", op);
  document.getElementById("tab-det").classList.toggle("active", !op);
  document.getElementById("view-op").classList.toggle("hidden", !op);
  document.getElementById("view-det").classList.toggle("hidden", op);
  pollTags();   // sin esto, al entrar a Detalle la tabla queda vacia hasta un segundo.
}

// Los controles no disparan su propio fetch: cambian el parametro que usa el
// proximo ciclo. Evita una peticion por tecla mientras se escribe.
document.getElementById("onlyDegraded").onchange = pollTags;

poll();
pollTags();
setInterval(() => { poll(); pollTags(); }, 1000);
</script>
</body>
</html>
